<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AisleGo</title>
  <link rel="icon" type="image/png" href="AisleGo-icon-512.png">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#18202d}
header{background:#111827;color:white;text-align:center;padding:22px}
header h1{margin:0;font-size:42px}
header span{color:#ef4444}
header p{margin:6px 0 0;font-size:18px;color:#d1d5db}
main{max-width:600px;margin:auto;padding:15px}
.card{background:white;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 3px 15px #0001}
button{width:100%;padding:16px;margin-top:10px;border:0;border-radius:14px;background:#111827;color:white;font-size:18px;font-weight:bold}
button.red{background:#ef4444}
button.light{background:#e5e7eb;color:#111827}
.big{text-align:center;font-size:52px;font-weight:bold;margin:10px}
.stat{display:flex;justify-content:space-between;padding:14px;border:1px solid #ddd;border-radius:14px;margin-top:10px}
#map{height:330px;background:#eef2f7;border-radius:18px;position:relative;overflow:hidden;border:2px solid #d1d5db}
.grid{position:absolute;inset:0;background-image:linear-gradient(#d5d9df 1px,transparent 1px),linear-gradient(90deg,#d5d9df 1px,transparent 1px);background-size:40px 40px}
#player{position:absolute;left:50%;top:50%;width:30px;height:30px;background:#2563eb;border:5px solid white;border-radius:50%;box-shadow:0 2px 8px #0005;transform:translate(-50%,-50%);z-index:5}
#arrow{position:absolute;left:50%;top:50%;width:5px;height:65px;background:#2563eb;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);z-index:4;border-radius:5px}
.item{padding:14px;border:1px solid #ddd;border-radius:14px;margin-top:9px;display:flex;justify-content:space-between}
.badge{background:#eef2ff;color:#3730a3;padding:5px 9px;border-radius:8px}
#status{text-align:center;color:#555;margin:10px}
</style>
</head>

<body>

<header>
<h1>Aisle<span>Go</span></h1>
<p>Indoor walking navigation</p>
</header>

<main>

<div class="card">
<h2>1. Start AisleGo</h2>
<button id="start">Allow Motion & Start</button>
<div id="status">Waiting to start...</div>
</div>

<div class="card">
<h2>Your position</h2>

<div id="map">
<div class="grid"></div>
<div id="arrow"></div>
<div id="player"></div>
</div>

<div class="stat">
<span>Steps</span><b id="steps">0</b>
</div>

<div class="stat">
<span>Distance</span><b id="distance">0.0 m</b>
</div>

<div class="stat">
<span>Heading</span><b id="heading">0°</b>
</div>

<button class="light" id="reset">Reset Walk</button>
</div>

<div class="card">
<h2>Test items</h2>

<div class="item">
<span>TV 60" JVC</span>
<span class="badge">Lounge</span>
</div>

<div class="item">
<span>Fan</span>
<span class="badge">Lounge</span>
</div>

<div class="item">
<span>Microwave</span>
<span class="badge">Kitchen</span>
</div>

<div class="item">
<span>Fridge</span>
<span class="badge">Kitchen</span>
</div>

<div class="item">
<span>TV</span>
<span class="badge">Bedroom 1</span>
</div>

<div class="item">
<span>TV</span>
<span class="badge">Bedroom 2</span>
</div>

<div class="item">
<span>Bed</span>
<span class="badge">Master Bedroom</span>
</div>

<div class="item">
<span>Bedside lamps</span>
<span class="badge">Master Bedroom</span>
</div>

</div>

</main>

<script>

let steps=0;
let distance=0;
let heading=0;
let running=false;
let lastStep=0;
let lastTime=0;
let gravity=9.8;

const player=document.getElementById("player");
const arrow=document.getElementById("arrow");

function updateScreen(){

document.getElementById("steps").textContent=steps;
document.getElementById("distance").textContent=distance.toFixed(1)+" m";
document.getElementById("heading").textContent=Math.round(heading)+"°";

let pixels=steps*7;

let rad=heading*Math.PI/180;

let x=Math.sin(rad)*pixels;
let y=-Math.cos(rad)*pixels;

let maxX=135;
let maxY=135;

x=Math.max(-maxX,Math.min(maxX,x));
y=Math.max(-maxY,Math.min(maxY,y));

player.style.left="calc(50% + "+x+"px)";
player.style.top="calc(50% + "+y+"px)";

arrow.style.left="calc(50% + "+x+"px)";
arrow.style.top="calc(50% + "+y+"px)";
arrow.style.transform=
"translate(-50%,-100%) rotate("+heading+"deg)";
}
